---
# Project source code URL: https://github.com/P3X-118/filebrowser (fork of https://github.com/gtsteffaniak/filebrowser)

filebrowser_quantum_enabled: true

filebrowser_quantum_identifier: filebrowser-quantum
filebrowser_quantum_base_path: "/{{ filebrowser_quantum_identifier }}"
filebrowser_quantum_cache_path: "{{ filebrowser_quantum_base_path }}/cache"
filebrowser_quantum_data_path: "{{ filebrowser_quantum_base_path }}/data"
filebrowser_quantum_files_path: "{{ filebrowser_quantum_base_path }}/files"

filebrowser_quantum_version: 1.1.2

filebrowser_quantum_uid: ""
filebrowser_quantum_gid: ""

# The scheme used for serving FileBrowser Quantum.
filebrowser_quantum_scheme: https

# The hostname at which FileBrowser Quantum is served.
filebrowser_quantum_hostname: ""

# The path at which FileBrowser Quantum is served.
# This value must either be `/` or not end with a slash (e.g. `/filebrowser-quantum`).
#
# Hosting FileBrowser Quantum under a subpath does not seem to be possible due to FileBrowser Quantum's
# technical limitations.
filebrowser_quantum_path_prefix: /

filebrowser_quantum_container_image: "{{ filebrowser_quantum_container_image_registry_prefix }}gtsteffaniak/filebrowser:{{ filebrowser_quantum_container_image_tag }}"
filebrowser_quantum_container_image_tag: "{{ filebrowser_quantum_version }}-stable"
filebrowser_quantum_container_image_registry_prefix: "{{ filebrowser_quantum_container_image_registry_prefix_upstream }}"
filebrowser_quantum_container_image_registry_prefix_upstream: "{{ filebrowser_quantum_container_image_registry_prefix_upstream_default }}"
filebrowser_quantum_container_image_registry_prefix_upstream_default: ghcr.io/
filebrowser_quantum_container_image_force_pull: "{{ filebrowser_quantum_container_image.endswith(':latest') }}"

filebrowser_quantum_container_image_self_build: false
filebrowser_quantum_container_image_self_build_name: "p3x-118/filebrowser:{{ filebrowser_quantum_container_image_self_build_repo_version }}"
filebrowser_quantum_container_image_self_build_repo: "https://github.com/P3X-118/filebrowser.git"
# Used verbatim as the git ref to check out, so release tags on the fork's `sgc`
# branch carry the bare version string (e.g. `1.5.0-0`), not a `v` prefix.
filebrowser_quantum_container_image_self_build_repo_version: "{{ filebrowser_quantum_version if filebrowser_quantum_version != 'latest' else 'main' }}"
filebrowser_quantum_container_image_self_build_src_files_path: "{{ filebrowser_quantum_base_path }}/docker-src"
# The Dockerfile lives under `_docker/` in the source repository, not at its root.
filebrowser_quantum_container_image_self_build_dockerfile: "_docker/Dockerfile"

# The base container network. It will be auto-created by this role if it doesn't exist already.
filebrowser_quantum_container_network: "{{ filebrowser_quantum_identifier }}"

# Control if the container network is deleted on uninstalling.
filebrowser_quantum_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `filebrowser_quantum_container_http_port`).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
filebrowser_quantum_container_http_host_bind_port: ""

# The port number in the container
filebrowser_quantum_container_http_port: 80

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
filebrowser_quantum_container_additional_networks: "{{ filebrowser_quantum_container_additional_networks_auto + filebrowser_quantum_container_additional_networks_custom }}"
filebrowser_quantum_container_additional_networks_auto: []
filebrowser_quantum_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
filebrowser_quantum_container_additional_volumes: "{{ filebrowser_quantum_container_additional_volumes_auto + filebrowser_quantum_container_additional_volumes_custom }}"
filebrowser_quantum_container_additional_volumes_auto: []
filebrowser_quantum_container_additional_volumes_custom: []

# filebrowser_quantum_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `filebrowser_quantum_container_labels_additional_labels_custom`.
filebrowser_quantum_container_labels_traefik_enabled: true
filebrowser_quantum_container_labels_traefik_docker_network: "{{ filebrowser_quantum_container_network }}"
filebrowser_quantum_container_labels_traefik_hostname: "{{ filebrowser_quantum_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/filebrowser-quantum`).
filebrowser_quantum_container_labels_traefik_path_prefix: "{{ filebrowser_quantum_path_prefix }}"
filebrowser_quantum_container_labels_traefik_rule: "Host(`{{ filebrowser_quantum_container_labels_traefik_hostname }}`){% if filebrowser_quantum_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ filebrowser_quantum_container_labels_traefik_path_prefix }}`){% endif %}"
filebrowser_quantum_container_labels_traefik_priority: 0
filebrowser_quantum_container_labels_traefik_entrypoints: web-secure
filebrowser_quantum_container_labels_traefik_tls: "{{ filebrowser_quantum_container_labels_traefik_entrypoints != 'web' }}"
filebrowser_quantum_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `filebrowser_quantum_container_labels_traefik_additional_request_headers_custom`
filebrowser_quantum_container_labels_traefik_additional_request_headers: "{{ filebrowser_quantum_container_labels_traefik_additional_request_headers_auto | combine(filebrowser_quantum_container_labels_traefik_additional_request_headers_custom) }}"
filebrowser_quantum_container_labels_traefik_additional_request_headers_auto: {}
filebrowser_quantum_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `filebrowser_quantum_container_labels_traefik_additional_response_headers_custom`
filebrowser_quantum_container_labels_traefik_additional_response_headers: "{{ filebrowser_quantum_container_labels_traefik_additional_response_headers_auto | combine(filebrowser_quantum_container_labels_traefik_additional_response_headers_custom) }}"
filebrowser_quantum_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': filebrowser_quantum_http_header_xss_protection} if filebrowser_quantum_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': filebrowser_quantum_http_header_content_type_options} if filebrowser_quantum_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': filebrowser_quantum_http_header_content_security_policy} if filebrowser_quantum_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': filebrowser_quantum_http_header_permissions_policy} if filebrowser_quantum_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': filebrowser_quantum_http_header_strict_transport_security} if filebrowser_quantum_http_header_strict_transport_security and filebrowser_quantum_container_labels_traefik_tls else {})
  }}
filebrowser_quantum_container_labels_traefik_additional_response_headers_custom: {}

# filebrowser_quantum_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `filebrowser_quantum_container_labels_additional_labels_custom`
#
# Example:
# filebrowser_quantum_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
filebrowser_quantum_container_labels_additional_labels: "{{ filebrowser_quantum_container_labels_additional_labels_auto + filebrowser_quantum_container_labels_additional_labels_custom }}"
filebrowser_quantum_container_labels_additional_labels_auto: []
filebrowser_quantum_container_labels_additional_labels_custom: []

# Specify the size of the container's tmpfs volume
filebrowser_quantum_container_tmpfs_dotcache_size: 128m

# A list of extra arguments to pass to the container (`docker create` command)
filebrowser_quantum_container_extra_arguments: "{{ filebrowser_quantum_container_extra_arguments_auto + filebrowser_quantum_container_extra_arguments_custom }}"
filebrowser_quantum_container_extra_arguments_auto: []
filebrowser_quantum_container_extra_arguments_custom: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
filebrowser_quantum_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
filebrowser_quantum_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
filebrowser_quantum_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
filebrowser_quantum_http_header_permissions_policy: "{{ 'interest-cohort=()' if filebrowser_quantum_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
filebrowser_quantum_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if filebrowser_quantum_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `filebrowser_quantum_http_header_permissions_policy`
filebrowser_quantum_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `filebrowser_quantum_http_header_strict_transport_security`
filebrowser_quantum_hsts_preload_enabled: false

# List of systemd services that the FileBrowser Quantum systemd service depends on
filebrowser_quantum_systemd_required_services_list: "{{ filebrowser_quantum_systemd_required_services_list_default + filebrowser_quantum_systemd_required_services_list_auto + filebrowser_quantum_systemd_required_services_list_custom }}"
filebrowser_quantum_systemd_required_services_list_default: "{{ [sysd_docker_service] if sysd_docker_service else [] }}"
filebrowser_quantum_systemd_required_services_list_auto: []
filebrowser_quantum_systemd_required_services_list_custom: []

# List of systemd services that the FileBrowser Quantum systemd service wants
filebrowser_quantum_systemd_wanted_services_list: "{{ filebrowser_quantum_systemd_wanted_services_list_default + filebrowser_quantum_systemd_wanted_services_list_auto + filebrowser_quantum_systemd_wanted_services_list_custom }}"
filebrowser_quantum_systemd_wanted_services_list_default: []
filebrowser_quantum_systemd_wanted_services_list_auto: []
filebrowser_quantum_systemd_wanted_services_list_custom: []

# Specify administrator's username
filebrowser_quantum_config_auth_adminusername: admin

# Control if OIDC authentication is enabled
# See: https://filebrowserquantum.com/en/docs/configuration/authentication/oidc/
filebrowser_quantum_config_auth_methods_oidc: false

# Specify OIDC client ID
filebrowser_quantum_config_auth_methods_oidc_clientid: ""

# Specify OIDC client secret
filebrowser_quantum_environment_variables_filebrowser_oidc_client_secret: ""

# Specify OIDC provider URL
# Example: https://sso.example.com/application/o/filebrowser/
filebrowser_quantum_config_auth_methods_oidc_issuerurl: ""

# Specify OIDC requested scopes
filebrowser_quantum_config_auth_methods_oidc_scopes: "email openid profile groups"

# Specify OIDC user field
filebrowser_quantum_config_auth_methods_oidc_useridentifier: "preferred_username"

# Control if OIDC TLS verification is disabled
filebrowser_quantum_config_auth_methods_oidc_disableverifytls: false

# Control if OIDC users are automatically created on the first login
filebrowser_quantum_config_auth_methods_oidc_createuser: true

# Control if Office integration is enabled
# See: https://filebrowserquantum.com/en/docs/integrations/office/configuration/
filebrowser_quantum_config_integrations_office: false

# Specify integrated Office URL
filebrowser_quantum_config_integrations_office_url: ""

# Specify integrated Office secret
filebrowser_quantum_config_integrations_office_secret: ""

# Additional configurations.
filebrowser_quantum_config_additional_configurations: ""

# Default FileBrowser Quantum configuration template which covers the generic use case.
# You can customize it by controlling the various variables inside it.
#
# For a more advanced customization, you can extend the default (see `filebrowser_quantum_configuration_yaml`)
# or completely replace this variable with your own template.
filebrowser_quantum_configuration_yaml: "{{ lookup('template', 'templates/config.yaml.j2') }}"

filebrowser_quantum_configuration_extension_yaml: |
  # Your custom YAML configuration for FileBrowser Quantum goes here.
  # This configuration extends the default starting configuration (`filebrowser_quantum_configuration_yaml`).
  #
  # You can override individual variables from the default configuration, or introduce new ones.
  #
  # If you need something more special, you can take full control by
  # completely redefining `filebrowser_quantum_configuration_yaml`.

filebrowser_quantum_configuration_extension: "{{ filebrowser_quantum_configuration_extension_yaml | from_yaml if filebrowser_quantum_configuration_extension_yaml | from_yaml is mapping else {} }}"

# Holds the final FileBrowser Quantum configuration (a combination of the default and its extension).
# You most likely don't need to touch this variable. Instead, see `filebrowser_quantum_configuration_yaml`.
filebrowser_quantum_configuration: "{{ filebrowser_quantum_configuration_yaml | from_yaml | combine(filebrowser_quantum_configuration_extension, recursive=True) }}"

# Specify the timezone
filebrowser_quantum_environment_variables_tz: UTC

# Control if password authentication is enabled with the environment variable
filebrowser_quantum_environment_variables_filebrowser_admin_password_enabled: true

# Specify the administrator's password
# See: https://filebrowserquantum.com/en/docs/configuration/authentication/password/#set-admin-password
filebrowser_quantum_environment_variables_filebrowser_admin_password: ""

# Additional environment variables.
filebrowser_quantum_environment_variables_additional_variables: ""

# filebrowser_quantum_restart_necessary controls whether the FileBrowser Quantum systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
filebrowser_quantum_restart_necessary: false
