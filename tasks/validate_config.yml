---
- name: Fail if required FileBrowser Quantum settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "item.when | bool and lookup('vars', item.name, default='') | string | length == 0"
  with_items:
    - { "name": "filebrowser_quantum_uid", when: true }
    - { "name": "filebrowser_quantum_gid", when: true }
    - { "name": "filebrowser_quantum_hostname", when: true }
    - { "name": "filebrowser_quantum_path_prefix", when: true }
    - { "name": "filebrowser_quantum_container_network", when: true }
    - { "name": "filebrowser_quantum_environment_variables_filebrowser_admin_password", when: "{{ filebrowser_quantum_environment_variables_filebrowser_admin_password_enabled }}"}

- name: Fail if OIDC authentication settings are missing (and OIDC authentication is enabled by setting host)
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) to correctly set up OIDC authentication.
  when: "filebrowser_quantum_config_auth_methods_oidc | bool and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - filebrowser_quantum_config_auth_methods_oidc_clientid
    - filebrowser_quantum_environment_variables_filebrowser_oidc_client_secret
    - filebrowser_quantum_config_auth_methods_oidc_issuerurl

- name: Fail if ONLYOFFICE Docs integration settings are missing (and OIDC authentication is enabled by setting host)
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) to correctly set up ONLYOFFICE Docs integration.
  when: "filebrowser_quantum_config_integrations_office | bool and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - filebrowser_quantum_config_integrations_office_url
    - filebrowser_quantum_config_integrations_office_secret

- name: Run if Traefik is enabled
  when: filebrowser_quantum_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for FileBrowser Quantum are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - filebrowser_quantum_container_labels_traefik_hostname
        - filebrowser_quantum_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `filebrowser_quantum_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if filebrowser_quantum_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          filebrowser_quantum_container_labels_traefik_path_prefix (`{{ filebrowser_quantum_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/filebrowser-quantum`).
      when: "filebrowser_quantum_container_labels_traefik_path_prefix != '/' and filebrowser_quantum_container_labels_traefik_path_prefix[-1] == '/'"
